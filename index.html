<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet — Apprentissage de l'anglais C1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper: #EEEAE0;
  --paper-2: #E4DFD1;
  --ink: #1F2A44;
  --ink-soft: #4B5468;
  --ochre: #B9891F;
  --ochre-deep: #8F6A16;
  --teal: #2F6F62;
  --teal-deep: #1F4D43;
  --brick: #A63A2F;
  --brick-deep: #7E2B22;
  --card: #F7F4EC;
  --line: rgba(31,42,68,0.14);
  --shadow: 0 1px 0 rgba(31,42,68,0.06), 0 8px 24px -12px rgba(31,42,68,0.25);
  --radius: 14px;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(31,42,68,0.05) 1px, transparent 0);
  background-size:22px 22px;
  min-height:100vh;
}
.app{
  max-width:760px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:0 18px 40px;
}
.hidden{display:none !important;}

/* Top bar */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 2px 14px;
  border-bottom:1px solid var(--line);
  margin-bottom:22px;
  position:sticky;
  top:0;
  background:var(--paper);
  z-index:5;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
  cursor:pointer;
}
.brand .mark{
  font-family:var(--serif);
  font-weight:600;
  font-size:22px;
  font-optical-sizing:auto;
}
.brand .tag{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:0.06em;
  text-transform:uppercase;
}
.streak-pill{
  display:flex;
  align-items:center;
  gap:6px;
  font-family:var(--mono);
  font-size:13px;
  color:var(--ochre-deep);
  background:rgba(185,137,31,0.14);
  border:1px solid rgba(185,137,31,0.35);
  padding:6px 12px;
  border-radius:999px;
}

/* Generic layout helpers */
.screen{ animation: fadein .25s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
h1.page-title{
  font-family:var(--serif);
  font-size:30px;
  font-weight:600;
  margin:0 0 4px;
}
p.page-sub{
  color:var(--ink-soft);
  margin:0 0 26px;
  font-size:15px;
  line-height:1.5;
}

/* Buttons */
.btn{
  font-family:var(--sans);
  font-weight:600;
  font-size:15px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  padding:13px 18px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
.btn:active{ transform:translateY(0); }
.btn-primary{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}
.btn-primary:hover{ box-shadow:0 8px 24px -10px rgba(31,42,68,0.5); }
.btn-ochre{ background:var(--ochre); color:#fff; border-color:var(--ochre-deep); }
.btn-teal{ background:var(--teal); color:#fff; border-color:var(--teal-deep); }
.btn-ghost{ background:transparent; }
.btn-block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.btn-lg{ padding:18px 22px; font-size:17px; border-radius:14px; }

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-pad{ padding:22px; }

/* Setup screen */
.setup-hero{
  text-align:center;
  padding:34px 0 10px;
}
.setup-hero .mark-big{
  font-family:var(--serif);
  font-size:42px;
  font-weight:600;
  margin:0;
}
.setup-hero .lede{
  color:var(--ink-soft);
  font-size:15.5px;
  max-width:480px;
  margin:10px auto 0;
  line-height:1.6;
}
.setup-steps{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:28px;
}
.step-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px;
}
.step-num{
  font-family:var(--mono);
  font-size:13px;
  width:30px;
  height:30px;
  border-radius:50%;
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:var(--ink-soft);
}
.step-row.done .step-num{ background:var(--teal); border-color:var(--teal-deep); color:#fff; }
.step-text{ flex:1; }
.step-text .t{ font-weight:600; font-size:14.5px; }
.step-text .s{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
input[type=file]{ display:none; }

/* Dashboard */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:22px;
}
.stat-box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 14px;
  text-align:center;
}
.stat-box .num{
  font-family:var(--mono);
  font-size:24px;
  font-weight:600;
  color:var(--ink);
}
.stat-box .lab{
  font-size:11.5px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-top:4px;
}
.cta-block{
  padding:26px 22px;
  text-align:center;
  margin-bottom:20px;
}
.cta-block .goal-line{
  font-family:var(--mono);
  font-size:13px;
  color:var(--ink-soft);
  margin-bottom:14px;
}
.level-bars{
  display:flex;
  flex-direction:column;
  gap:9px;
}
.level-bar-row{
  display:grid;
  grid-template-columns:36px 1fr 44px;
  align-items:center;
  gap:10px;
  font-size:12.5px;
}
.level-bar-row:has(.kind-tag){ grid-template-columns:110px 1fr 44px; }
.level-tag{
  font-family:var(--mono);
  font-weight:600;
  padding:2px 0;
  text-align:center;
  border-radius:5px;
  font-size:11px;
}
.lvl-A1{ background:rgba(47,111,98,0.16); color:var(--teal-deep); }
.lvl-A2{ background:rgba(47,111,98,0.28); color:var(--teal-deep); }
.lvl-B1{ background:rgba(185,137,31,0.16); color:var(--ochre-deep); }
.lvl-B2{ background:rgba(185,137,31,0.30); color:var(--ochre-deep); }
.lvl-C1{ background:rgba(166,58,47,0.16); color:var(--brick-deep); }
.lvl-C2{ background:rgba(166,58,47,0.30); color:var(--brick-deep); }
.kind-tag{
  font-family:var(--mono);
  font-weight:600;
  font-size:11px;
  color:var(--ink-soft);
  white-space:nowrap;
}

/* Audio companion avatars */
.audio-companion{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:500;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 14px 6px 6px;
  box-shadow:0 6px 18px rgba(0,0,0,0.12);
  transition:opacity .15s ease, transform .15s ease;
}
.audio-companion.hidden{ opacity:0; pointer-events:none; transform:translateY(8px); }
.audio-companion .avatar{ display:none; border-radius:50%; background:var(--paper-2); }
.audio-companion .avatar.av-active{ display:block; }
.audio-companion .avatar.speaking .mouth{ animation:talk .38s ease-in-out infinite alternate; }
@keyframes talk{ from{ ry:2.5; } to{ ry:6.5; } }
.companion-label{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); white-space:nowrap; }
.numbered-row{ display:flex; gap:8px; align-items:flex-start; font-size:13.5px; padding:4px 0; border-bottom:1px dashed var(--line); }
.numbered-row:last-child{ border-bottom:none; }
.num-idx{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); background:var(--paper-2); border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px; }
.mini-note{ font-size:11.5px; color:var(--ink-soft); font-style:italic; margin:2px 0 8px; }
.bar-track{ background:var(--paper-2); border-radius:6px; height:8px; overflow:hidden; }
.bar-fill{ height:100%; background:var(--ink); border-radius:6px; }
.bar-count{ font-family:var(--mono); color:var(--ink-soft); text-align:right; }

.section-title{
  font-family:var(--serif);
  font-size:17px;
  font-weight:600;
  margin:0 0 12px;
}
.row-actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.row-actions .btn{ flex:1; min-width:150px; }

/* Browse */
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.chip{
  font-family:var(--mono);
  font-size:12.5px;
  padding:7px 13px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card);
  cursor:pointer;
  color:var(--ink-soft);
}
.chip.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.word-list{ display:flex; flex-direction:column; gap:8px; }
.word-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 15px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  cursor:pointer;
}
.word-row:hover{ border-color:var(--ink); }
.word-row .w{ font-family:var(--serif); font-weight:600; font-size:16px; flex:1; }
.word-row .p{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); }
.word-row .badge-known{ width:8px; height:8px; border-radius:50%; background:var(--teal); flex-shrink:0; }
.search-box{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--card);
  font-size:14.5px;
  margin-bottom:14px;
  font-family:var(--sans);
}
.search-box:focus{ outline:none; border-color:var(--ink); }

/* Word detail sheet */
.detail-overlay{
  position:fixed; inset:0; background:rgba(31,42,68,0.35);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:50;
}
.detail-sheet{
  background:var(--card);
  width:100%;
  max-width:760px;
  max-height:88vh;
  overflow-y:auto;
  border-radius:20px 20px 0 0;
  padding:26px 22px 34px;
  box-shadow:0 -12px 40px rgba(0,0,0,0.25);
}
.detail-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.detail-word{ font-family:var(--serif); font-size:30px; font-weight:600; }
.detail-phon{ font-family:var(--mono); color:var(--ink-soft); font-size:14px; margin-top:2px; }
.close-x{ background:none; border:none; font-size:22px; cursor:pointer; color:var(--ink-soft); padding:4px; }
.audio-btn{
  width:44px; height:44px; border-radius:50%;
  background:var(--ink); color:var(--paper);
  border:none; cursor:pointer; font-size:17px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.audio-btn:disabled{ opacity:.3; }
.detail-section{ margin-top:18px; }
.detail-section .h{
  font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-soft); margin-bottom:8px;
}
.translation-line{ font-size:18px; font-weight:600; color:var(--teal-deep); }
.def-line{ font-size:14.5px; line-height:1.55; margin-top:4px;}
.example-line{ font-size:14px; line-height:1.6; padding:9px 0; border-top:1px solid var(--line); }
.example-line:first-child{ border-top:none; }
.example-line .en{ color:var(--ink); }
.example-line .fr{ color:var(--ink-soft); margin-top:2px; }

/* Zones où appuyer sur le texte lit l'audio correspondant — plus de bouton
   "Écouter" séparé : on tape la définition, l'exemple, le mot, etc. */
.tap-audio{ cursor:pointer; border-radius:8px; transition:background .15s ease; }
.tap-audio:active{ background:var(--paper-2); }
.tap-audio .audio-cue{ color:var(--teal); font-size:.85em; margin-left:6px; opacity:.6; white-space:nowrap; }
.tag-cloud{ display:flex; flex-wrap:wrap; gap:7px; }
.tag-pill{
  font-family:var(--mono); font-size:12px; padding:5px 10px;
  background:var(--paper-2); border-radius:7px; color:var(--ink-soft);
}
.error-note{
  font-size:13.5px; line-height:1.5; background:rgba(166,58,47,0.08);
  border-left:3px solid var(--brick); padding:10px 12px; border-radius:0 8px 8px 0; color:var(--ink);
}

/* Session runner */
.session-top{
  display:flex; align-items:center; gap:12px; margin-bottom:22px;
}
.session-progress-track{
  flex:1; height:6px; background:var(--paper-2); border-radius:6px; overflow:hidden;
}
.session-progress-fill{ height:100%; background:var(--ochre); border-radius:6px; transition:width .3s ease; }
.session-count{ font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }
.exit-x{ background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }

.ex-card{ padding:30px 24px; text-align:center; min-height:260px; display:flex; flex-direction:column; }
.ex-kind{
  font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--ink-soft); margin-bottom:18px;
}
.ex-level-tag{ display:inline-block; margin-left:8px; }
.ex-prompt-word{
  font-family:var(--serif); font-size:38px; font-weight:600; margin:6px 0 2px;
}
.ex-prompt-phon{ font-family:var(--mono); color:var(--ink-soft); font-size:14px; }
.ex-prompt-sentence{ font-size:19px; line-height:1.6; margin:14px 0; font-family:var(--serif); }
.ex-prompt-sentence .blank{
  display:inline-block; min-width:70px; border-bottom:2px solid var(--ochre);
}
.ex-body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; }
.big-audio-btn{
  width:76px; height:76px; border-radius:50%; margin:6px auto 0;
  background:var(--teal); color:#fff; border:none; font-size:26px; cursor:pointer;
}
.big-audio-btn:disabled{ opacity:.3; }
.mcq-grid{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.mcq-opt{
  padding:14px 16px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper); cursor:pointer; font-size:15px; text-align:left;
  font-family:var(--sans);
}
.mcq-opt:hover{ border-color:var(--ink); }
.mcq-opt.correct{ background:rgba(47,111,98,0.18); border-color:var(--teal); }
.mcq-opt.wrong{ background:rgba(166,58,47,0.14); border-color:var(--brick); }
.text-answer{
  padding:14px 16px; border-radius:10px; border:1.5px solid var(--line);
  font-size:17px; font-family:var(--mono); text-align:center; width:100%;
}
.text-answer:focus{ outline:none; border-color:var(--ink); }
.text-answer.correct{ border-color:var(--teal); background:rgba(47,111,98,0.1); }
.text-answer.wrong{ border-color:var(--brick); background:rgba(166,58,47,0.08); }
.feedback-line{ font-size:14px; margin-top:8px; }
.feedback-line.correct{ color:var(--teal-deep); }
.feedback-line.wrong{ color:var(--brick-deep); }
.grade-row{ display:flex; gap:8px; margin-top:8px; }
.grade-btn{ flex:1; padding:14px 8px; border-radius:10px; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-family:var(--sans); font-weight:600; font-size:13.5px; }
.grade-again{ color:var(--brick-deep); }
.grade-hard{ color:var(--ochre-deep); }
.grade-good{ color:var(--teal-deep); }
.grade-easy{ color:var(--ink); }
.grade-btn:hover{ box-shadow:var(--shadow); }
.flip-hint{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:10px; }

/* Session summary */
.summary-stamp{
  width:96px; height:96px; border-radius:50%; border:3px solid var(--ochre);
  display:flex; align-items:center; justify-content:center; margin:20px auto;
  font-family:var(--serif); font-size:30px; font-weight:700; color:var(--ochre-deep);
  transform:rotate(-6deg);
}

/* Nav bottom */
.tabbar{
  position:sticky; bottom:0; margin-top:auto;
  display:flex; gap:6px; padding:10px 4px 0;
  background:var(--paper);
  border-top:1px solid var(--line);
}
.tab-btn{
  flex:1; background:none; border:none; padding:10px 4px;
  font-family:var(--sans); font-size:11.5px; color:var(--ink-soft);
  cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
}
.tab-btn .ic{ font-size:18px; }
.tab-btn.active{ color:var(--ink); font-weight:700; }

/* Settings */
.setting-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 0; border-bottom:1px solid var(--line);
  gap:16px;
}
.setting-row:last-child{ border-bottom:none; }
.setting-row .t{ font-weight:600; font-size:14.5px; }
.setting-row .s{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
input[type=range]{ width:120px; accent-color:var(--ink); }
.danger-btn{ color:var(--brick-deep); border-color:rgba(166,58,47,0.4); }

@media (max-width:480px){
  .stat-grid{ grid-template-columns:repeat(3,1fr); gap:8px; }
  .ex-prompt-word{ font-size:30px; }
  .setup-hero .mark-big{ font-size:34px; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- TOP BAR (hidden during setup) -->
  <div class="topbar hidden" id="topbar">
    <div class="brand" onclick="Router.go('dashboard')">
      <span class="mark">Carnet</span>
      <span class="tag">English C1</span>
    </div>
    <div class="streak-pill" id="streakPill">🔥 0</div>
  </div>

  <!-- SCREENS -->
  <div id="screens"></div>

  <div id="audioCompanion" class="audio-companion hidden">
    <svg id="avatarFemale" class="avatar av-hidden" viewBox="0 0 100 100" width="56" height="56">
      <circle cx="50" cy="42" r="26" fill="#f2d9c4"/>
      <path d="M24 40 a26 26 0 0 1 52 0 v6 h-6 a20 20 0 0 0 -40 0 h-6 z" fill="#5a3d2b"/>
      <circle cx="40" cy="42" r="3" fill="#3a2a20"/>
      <circle cx="60" cy="42" r="3" fill="#3a2a20"/>
      <ellipse class="mouth" cx="50" cy="54" rx="7" ry="2.5" fill="#a6473a"/>
      <path d="M20 92 a30 30 0 0 1 60 0 z" fill="#2f6f62"/>
    </svg>
    <svg id="avatarMale" class="avatar av-hidden" viewBox="0 0 100 100" width="56" height="56">
      <circle cx="50" cy="42" r="26" fill="#e9c9a8"/>
      <path d="M24 34 a26 26 0 0 1 52 0 q-4 -6 -26 -6 t-26 6 z" fill="#2a2016"/>
      <circle cx="40" cy="42" r="3" fill="#241a12"/>
      <circle cx="60" cy="42" r="3" fill="#241a12"/>
      <ellipse class="mouth" cx="50" cy="54" rx="7" ry="2.5" fill="#8a3b2f"/>
      <path d="M20 92 a30 30 0 0 1 60 0 z" fill="#a63a2f"/>
    </svg>
    <span id="companionLabel" class="companion-label"></span>
  </div>

  <!-- BOTTOM TAB BAR -->
  <div class="tabbar hidden" id="tabbar">
    <button class="tab-btn" data-screen="dashboard"><span class="ic">◆</span>Accueil</button>
    <button class="tab-btn" data-screen="browse"><span class="ic">▤</span>Explorer</button>
    <button class="tab-btn" data-screen="stats"><span class="ic">▲</span>Stats</button>
    <button class="tab-btn" data-screen="settings"><span class="ic">⚙</span>Réglages</button>
  </div>

</div>

<script>
  // Anti-cache : Safari iOS (et le CDN de GitHub Pages) peuvent continuer à
  // servir une ancienne version de app.js en cache même après un nouveau
  // commit. On charge donc app.js avec un paramètre qui change à chaque
  // chargement de page, ce qui force un fetch réseau frais à chaque fois.
  var s = document.createElement('script');
  s.src = 'app.js?v=' + Date.now();
  document.body.appendChild(s);
</script>
</body>
</html>
